name: Deploy to Hugging Face

# Requires repository secret HF_TOKEN (write access) and variable HF_SPACE_ID
# (e.g. user/legal-atlas). The Space must already exist; see docs/deployment.md.
# Source PDFs are not in git, so this job leaves any PDFs already on the Space intact.
on:
  push:
    branches: [main]
    paths: [app.py, requirements.txt, src/**, config/**, data/indexes/**, data/processed/**, deploy/huggingface/**]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Missing configuration used to skip this job silently; now it is reported on the run page.
      - name: Check configuration
        id: config
        env:
          HAS_TOKEN: ${{ secrets.HF_TOKEN != '' }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ -n "$HF_SPACE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Deploying to https://huggingface.co/spaces/$HF_SPACE_ID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="Space deploy not configured: set repository secret HF_TOKEN (write) and variable HF_SPACE_ID (Settings → Secrets and variables → Actions)."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.config.outputs.ready == 'true'
        run: pip install "huggingface_hub>=0.30"
      - name: Upload to Space
        if: steps.config.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          DEPLOY_MESSAGE: "Deploy ${{ github.sha }}"
        run: python scripts/deploy_hf.py
