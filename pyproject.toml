[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indonesian-legal-rag"
version = "0.1.0"
description = "An Indonesian legal RAG portfolio with hybrid retrieval, reproducible evaluation, and Gemini citations"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "rank-bm25==0.2.2",
  "sentence-transformers>=3,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
ingestion = ["docling>=2.131,<3"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
legal-rag = "legal_rag.__main__:main"

[tool.setuptools.packages.find]
include = ["legal_rag*"]

[tool.setuptools.package-data]
legal_rag = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 110
exclude = ["archive", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
